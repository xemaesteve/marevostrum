<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apartamento Perla | Marevostrum</title>

  <link href="https://fonts.cdnfonts.com/css/gotham-ssm" rel="stylesheet">

  <style>
    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body {
      font-family:'Gotham SSm', sans-serif;
      background:#f7f4ee;
      color:#243B7A;
    }

    header {
      position:absolute;
      top:0;
      left:0;
      width:100%;
      padding:38px 7%;
      z-index:10;
    }

    .logo {
      width:260px;
      filter:brightness(0) invert(1);
    }

    .hero-perla {
      min-height:92vh;
      background:
        linear-gradient(90deg, rgba(0,39,78,.78), rgba(0,39,78,.25)),
        url("images/apartamentos/perla/perla-3.jpg");
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:center;
      padding:150px 7% 90px;
      color:white;
    }

    .hero-content {
      max-width:660px;
    }

    .hero-content span {
      color:#ff5b16;
      text-transform:uppercase;
      font-size:13px;
      letter-spacing:2px;
      font-weight:600;
      display:block;
      margin-bottom:20px;
    }

    h1 {
      font-size:68px;
      line-height:1.05;
      text-transform:uppercase;
      letter-spacing:2px;
      margin-bottom:28px;
    }

    p {
      font-size:18px;
      line-height:1.7;
      font-weight:300;
      max-width:560px;
      margin-bottom:34px;
    }

    .btn {
      display:inline-block;
      background:#ff5b16;
      color:white;
      padding:16px 26px;
      border-radius:28px;
      text-decoration:none;
      text-transform:uppercase;
      font-size:12px;
      letter-spacing:1.5px;
      font-weight:600;
      margin-right:12px;
    }

    .btn-secondary {
      background:transparent;
      border:1px solid white;
    }

    @media(max-width:800px) {
      header {
        padding:26px 6%;
      }

      .logo {
        width:210px;
      }

      .hero-perla {
        padding:160px 6% 80px;
      }

      h1 {
        font-size:42px;
      }

      p {
        font-size:16px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html">
    <img class="logo" src="MAREVOSTRUM logo.svg" alt="Marevostrum Estancias">
  </a>
</header>

<section class="hero-perla">
  <div class="hero-content">
    <span>Apartamento Perla</span>

    <h1>Peñíscola entera delante, silencio detrás.</h1>

    <p>
      Vistas, calma y aparcamiento fácil. Un apartamento para mirar el mar,
      teletrabajar con luz natural y volver a casa sin el ruido del centro.
    </p>

    <a class="btn" href="#disponibilidad">Consultar disponibilidad</a>
    <a class="btn btn-secondary" href="index.html">Volver</a>
  </div>
</section>

</body>
</html>
